apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 00-namespace.yaml
  - 05-postgres.yaml
  - 10-backend.yaml
  - 30-ingress.yaml
  - resource-policy.yaml
  # 웹(frontend)도 이 pull 시크릿을 쓴다. 네임스페이스 공용이라 여기 한 곳에만 둔다.
  - secrets/ghcr-pull.sealed.json
  - secrets/fulfillment-backend.sealed.json
  - secrets/fulfillment-postgres.sealed.json
# 비밀이 아닌 설정. 이름에 내용 해시가 붙어 값이 바뀌면 backend가 자동으로 롤링된다.
configMapGenerator:
  - name: backend-config
    namespace: fulfillment
    literals:
      # postgres Service(같은 네임스페이스)를 가리킨다. DB 이름은 fulfillment-postgres의 POSTGRES_DB와 같다.
      - DB_URL=jdbc:postgresql://postgres:5432/fulfillment
      # application.yml에 기본값이 없다. Traefik이 HTTPS로 받으니 Secure 쿠키를 켠다.
      - SESSION_COOKIE_SECURE=true
# fulfillment-backend 레포 CI가 이미지를 발행한 뒤 `kustomize edit set image`로 newTag를 커밋한다.
images:
  - name: ghcr.io/fulfillment-junghaebom/fulfillment-backend
    newName: ghcr.io/fulfillment-junghaebom/fulfillment-backend
    newTag: sha-9587c4a42fe6
