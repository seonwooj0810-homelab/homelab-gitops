apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: fulfillment
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      # ghcr.io/fulfillment-junghaebom/fulfillment-web은 비공개 패키지다. ghcr-pull은 backend 쪽 kustomization이 만든다.
      imagePullSecrets:
        - name: ghcr-pull
      # Dockerfile이 uid 10001(nextjs)로 USER를 지정하지만, k8s 레벨에서도 강제해
      # 이미지가 root로 바뀌어도 파드가 root로 뜨지 못하게 막는다(defense in depth).
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: frontend
          image: ghcr.io/fulfillment-junghaebom/fulfillment-web:bootstrap
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 3000
          # 백엔드 주소 설정이 없다. 브라우저가 같은 호스트의 /api/v1/*를 부르고 ingress가 backend로 보낸다.
          resources:
            requests: { memory: 128Mi, cpu: 50m }
            limits: { memory: 512Mi, cpu: 500m }
          # /는 /convert로 리다이렉트한다. /login은 백엔드 없이도 200을 준다.
          readinessProbe:
            httpGet: { path: /login, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /login, port: 3000 }
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: fulfillment
spec:
  selector: { app: frontend }
  ports:
    - port: 3000
      targetPort: 3000
