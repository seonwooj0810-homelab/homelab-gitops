apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ttalkkak
  namespace: ttalkkak
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # presence WebSocket(/ws)은 클리커 화면에 있는 동안 열려 있다. 기본 읽기 타임아웃 60초면 딸깍하지 않고
    # 보기만 하는 사용자의 연결이 끊긴다(말잇다와 같은 값).
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [ ttalkkak.junghaebom.com ]
      secretName: ttalkkak-junghaebom-tls
  rules:
    # 한 도메인을 경로로 나눈다. /(웹)은 웹을 만들 때 추가한다.
    # /actuator는 규칙이 없어 외부로 나가지 않는다 — probe와 ServiceMonitor는 클러스터 안에서만 닿는다.
    - host: ttalkkak.junghaebom.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: backend, port: { number: 8080 } } }
          - path: /ws
            pathType: Prefix
            backend: { service: { name: backend, port: { number: 8080 } } }
