# redis-exporter (설계 3단계)
# redis는 --requirepass로 떠 있으므로 같은 시크릿의 비밀번호를 그대로 쓴다.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  namespace: geonganghaegym
  labels:
    app.kubernetes.io/name: redis-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-exporter
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 59000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: exporter
          image: oliver006/redis_exporter:v1.78.0-alpine
          env:
            - name: REDIS_ADDR
              value: redis://redis.geonganghaegym.svc.cluster.local:6379
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: REDIS_PASSWORD
          ports:
            - name: metrics
              containerPort: 9121
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits:   {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
  namespace: geonganghaegym
  labels:
    app.kubernetes.io/name: redis-exporter
spec:
  selector:
    app.kubernetes.io/name: redis-exporter
  ports:
    - name: metrics
      port: 9121
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: redis-exporter
  namespace: geonganghaegym
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-exporter
  endpoints:
    - port: metrics
      interval: 30s
