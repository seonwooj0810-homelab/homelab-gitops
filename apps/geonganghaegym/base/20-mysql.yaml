apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: geonganghaegym
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
  clusterIP: None
---
# 위 mysql은 StatefulSet용 headless라 Tailscale operator가 DNAT할 ClusterIP가 없다. 같은 파드를 가리키는
# ClusterIP Service를 따로 두고 tailnet에만 노출한다(맥북 접속용). bootstrap/platform-tailscale.yaml 참고
apiVersion: v1
kind: Service
metadata:
  name: mysql-tailnet
  namespace: geonganghaegym
  annotations:
    tailscale.com/expose: "true"
    # ACL이 맥북 → tag:db만 허용한다(operations/README.md "Tailscale")
    tailscale.com/tags: "tag:db"
    tailscale.com/hostname: geonganghaegym-db
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: geonganghaegym
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
          envFrom:
            - secretRef:
                name: db-credentials
          ports:
            - containerPort: 3306
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {cpu: "1", memory: 2Gi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command: [sh, -c, 'mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD']
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [sh, -c, 'mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD']
            initialDelaySeconds: 60
            periodSeconds: 30
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
