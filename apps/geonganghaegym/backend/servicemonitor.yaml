# 애플리케이션 메트릭 스크랩(설계 3단계).
#
# 이 백엔드는 **actuator를 8080이 아니라 7070에서 서빙한다**
# (application.yml의 management.server.port: 7070). 앱 포트로 잡으면 404가 나고
# 타깃이 DOWN으로 남는다. Service의 `actuator` 포트 이름으로 지정해 실수를 막는다.
#
# 앱 레포(geonganghaegym/geonganghaegym-backend)는 이미 actuator + micrometer-registry-prometheus를
# 갖추고 exposure에 prometheus를 포함하고 있어 코드 변경이 필요 없었다.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: geonganghaegym-backend
  namespace: geonganghaegym
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: backend
  endpoints:
    - port: actuator
      path: /actuator/prometheus
      interval: 30s
