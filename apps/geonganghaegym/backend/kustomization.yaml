apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: geonganghaegym

# deployment.yaml lives in the app repo so backend developers can own it.
# Other resources (service, pvc) and the image tag are platform concerns.
resources:
- https://raw.githubusercontent.com/geonganghaegym/geonganghaegym-backend/main/deployment.yaml
- service.yaml
- pvc.yaml
- servicemonitor.yaml

# Image tag is updated by backend repo CI via `kustomize edit set image`.
images:
- name: ghcr.io/geonganghaegym/geonganghaegym-backend
  newName: ghcr.io/geonganghaegym/geonganghaegym-backend
  newTag: sha-0ab4096344e8

# 비밀이 아닌 설정. 이름에 내용 해시가 붙어 값이 바뀌면 Deployment가 자동으로 롤링된다.
# 앱 레포 deployment.yaml의 configMapRef(backend-config)는 같은 kustomization 안에 있어야
# 해시 붙은 이름으로 바뀌므로 overlays/prod가 아니라 여기 둔다.
configMapGenerator:
- name: backend-config
  envs:
  - backend-config.env

# 시크릿은 해시 이름이 없으니 Reloader가 변경을 감지해 롤링한다(platform/reloader.values.yaml).
patches:
- target:
    kind: Deployment
    name: backend
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: backend
      annotations:
        reloader.stakater.com/auto: "true"
