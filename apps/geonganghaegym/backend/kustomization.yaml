apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: geonganghaegym

# deployment.yaml lives in the app repo so backend developers can own it.
# Other resources (service, pvc) and the image tag are platform concerns.
resources:
- https://raw.githubusercontent.com/geonganghaegym/geonganghaegym-backend/develop/deployment.yaml
- service.yaml
- pvc.yaml
- servicemonitor.yaml

# Image tag is updated by backend repo CI via `kustomize edit set image`.
images:
- name: ghcr.io/geonganghaegym/geonganghaegym-backend
  newName: ghcr.io/geonganghaegym/geonganghaegym-backend
  newTag: sha-0a755e711883
