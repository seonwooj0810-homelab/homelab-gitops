apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: geonganghaegym

resources:
- https://raw.githubusercontent.com/geonganghaegym/geonganghaegym-web/main/deployment.yaml
- service.yaml

images:
- name: ghcr.io/geonganghaegym/geonganghaegym-web
  newName: ghcr.io/geonganghaegym/geonganghaegym-web
  newTag: sha-625b847fbca6

# 서버 전용 런타임 설정(비밀 아님). NEXT_PUBLIC_*는 빌드 때 번들에 박히므로 여기 두지 않는다.
configMapGenerator:
- literals:
  - INTERNAL_API_URL=http://backend:8080
  name: frontend-config

patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: frontend
      annotations:
        reloader.stakater.com/auto: "true"
  target:
    kind: Deployment
    name: frontend
