apiVersion: v1
kind: Service
metadata:
  name: backend
  # ServiceMonitor가 이 Service를 고르는 근거다(servicemonitor.yaml).
  # 라벨이 없으면 셀렉터가 아무것도 매치하지 않고, 그 상태는 DOWN이 아니라
  # "타깃이 아예 없음"으로 보여서 실패가 드러나지 않는다.
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: actuator
      port: 7070
      targetPort: 7070
