apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tobehealthy
  namespace: tobehealthy
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [geonganghaejim.site]
      secretName: geonganghaejim-tls
    # 새 호스트는 인증서를 따로 둔다. 발급이 실패해도 기존 인증서 갱신에 번지지 않는다.
    - hosts: [health.junghaebom.com]
      secretName: health-junghaebom-tls
  rules:
    - host: geonganghaejim.site
      # 두 호스트가 같은 경로 표를 쓴다. 경로는 여기 한 곳만 고친다.
      http: &tobehealthy-paths
        paths:
          - path: /api/callback/apple
            pathType: Exact
            backend:
              service:
                name: frontend
                port:
                  number: 3000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /api-docs
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /v3/api-docs
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /swagger-ui
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /files
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
    - host: health.junghaebom.com
      http: *tobehealthy-paths
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tobehealthy-www-redirect
  namespace: tobehealthy
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/permanent-redirect: https://geonganghaejim.site/
spec:
  ingressClassName: nginx
  tls:
    - hosts: [www.geonganghaejim.site]
      secretName: www-geonganghaejim-tls
  rules:
    - host: www.geonganghaejim.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
