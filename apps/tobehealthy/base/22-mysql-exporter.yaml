# mysqld-exporter (설계 3단계)
#
# 전용 `exporter` 계정을 쓴다.
#
# 처음에는 root로 붙이려 했으나 **이 MySQL에는 `root@localhost`만 있고 `root@%`가 없어**
# 원격 접속 자체가 불가능하다(`Access denied for user 'root'@'10.42.0.232'`).
# 앱 사용자(`app@%`)로는 PROCESS·REPLICATION CLIENT가 없어 절반만 수집된다.
#
# 그래서 읽기 전용 모니터링 계정을 하나 만들었다. **GitOps로 표현되지 않는 수동 DDL이라
# operations/README.md의 재구축 절차에 SQL을 적어 두었다.** 비밀번호는 SealedSecret에 있다.
#   GRANT SELECT, PROCESS, REPLICATION CLIENT ON *.* TO `exporter`@`%`  (MAX_USER_CONNECTIONS 3)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-exporter
  namespace: tobehealthy
  labels:
    app.kubernetes.io/name: mysql-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql-exporter
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: exporter
          image: prom/mysqld-exporter:v0.17.2
          args:
            - --mysqld.address=mysql.tobehealthy.svc.cluster.local:3306
            - --mysqld.username=exporter
          env:
            # v0.15부터 DATA_SOURCE_NAME이 아니라 이 env를 쓴다.
            - name: MYSQLD_EXPORTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-exporter-credentials
                  key: MYSQLD_EXPORTER_PASSWORD
          ports:
            - name: metrics
              containerPort: 9104
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits:   {memory: 96Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-exporter
  namespace: tobehealthy
  labels:
    app.kubernetes.io/name: mysql-exporter
spec:
  selector:
    app.kubernetes.io/name: mysql-exporter
  ports:
    - name: metrics
      port: 9104
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mysql-exporter
  namespace: tobehealthy
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql-exporter
  endpoints:
    - port: metrics
      interval: 30s
