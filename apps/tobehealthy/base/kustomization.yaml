apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tobehealthy

# Shared/platform resources for the tobehealthy app.
# backend and frontend Deployments live in their own repos:
#   - to-be-healthy/backend    -> k8s/
#   - to-be-healthy/frontend   -> k8s/
# Argo CD Applications: bootstrap/app-backend.yaml, bootstrap/app-frontend.yaml
resources:
  - resource-policy.yaml
  - 00-namespace.yaml
  - 20-mysql.yaml
  - 21-redis.yaml
  - 22-mysql-exporter.yaml
  - 23-redis-exporter.yaml
  - 40-ingress.yaml
