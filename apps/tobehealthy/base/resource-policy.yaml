apiVersion: v1
kind: LimitRange
metadata:
  name: workload-defaults
  namespace: tobehealthy
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 100m, memory: 128Mi}
      default: {cpu: "1", memory: 512Mi}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: workload-budget
  namespace: tobehealthy
spec:
  hard:
    requests.cpu: "3"
    requests.memory: 4Gi
    limits.cpu: "8"
    limits.memory: 8Gi
    pods: "20"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: project-ingress
  namespace: tobehealthy
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - {protocol: TCP, port: 8080}
        - {protocol: TCP, port: 3000}
    # 관측 스택의 Prometheus가 이 네임스페이스를 스크랩할 수 있게 연다(설계 3단계).
    # 0~2단계는 이 규칙 없이 동작했다 — Pod CPU/메모리는 노드의 kubelet cAdvisor에서 나오고
    # 로그는 Alloy가 노드 파일을 읽기 때문이다. **애플리케이션 내부 메트릭과 DB exporter만**
    # 네임스페이스 안으로 들어오는 연결을 필요로 한다.
    # 포트를 열거해 한정한다. podSelector를 비워 두면 default-deny의 의미가 사라진다.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - {protocol: TCP, port: 7070}   # backend actuator (management.server.port — 8080이 아니다)
        - {protocol: TCP, port: 9104}   # mysqld-exporter
        - {protocol: TCP, port: 9121}   # redis-exporter
        - {protocol: TCP, port: 9187}   # postgres-exporter
---
# 인증서 갱신 때 임시로 생성되는 HTTP-01 solver만 허용한다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: certificate-http01
  namespace: tobehealthy
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - {protocol: TCP, port: 8089}
