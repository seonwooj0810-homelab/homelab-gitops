apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: malitda
spec:
  replicas: 1
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      # Dockerfile이 uid 10001(malitda)로 USER를 지정하지만, k8s 레벨에서도 강제해
      # 이미지가 root로 바뀌어도 파드가 root로 뜨지 못하게 막는다(defense in depth).
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: backend
          image: malitda/backend:bootstrap
          # CI가 GHCR에 발행한 커밋 태그를 Kustomize로 고정한다.
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 8080
          env:
            - name: AZURE_SPEECH_KEY
              valueFrom:
                secretKeyRef: { name: malitda-azure, key: AZURE_SPEECH_KEY }
            - name: AZURE_SPEECH_REGION
              value: koreacentral
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef: { name: malitda-gemini, key: GEMINI_API_KEY }
            # CORS와 WebSocket 허용 오리진을 같은 값으로 묶는다.
            - name: FRONTEND_ORIGIN
              value: https://malitda.geonganghaejim.site
            # 채점 결과 참고용 로그 저장소. postgres Service(같은 네임스페이스)를 가리킨다.
            - name: DB_HOST
              value: postgres
            - name: DB_NAME
              valueFrom: { secretKeyRef: { name: malitda-postgres, key: POSTGRES_DB } }
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: malitda-postgres, key: POSTGRES_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: malitda-postgres, key: POSTGRES_PASSWORD } }
          resources:
            requests: { memory: 512Mi, cpu: 250m }
            limits: { memory: 1Gi,   cpu: "1" }
          # startup이 끝날 때까지 readiness/liveness를 실행하지 않는다.
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 20
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: malitda
spec:
  selector: { app: backend }
  ports:
    - port: 8080
      targetPort: 8080
