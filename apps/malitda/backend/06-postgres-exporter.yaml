# postgres-exporter (설계 3단계)
#
# DATA_SOURCE_URI/USER/PASS 를 나눠 주면 exporter가 DSN을 조립한다.
# 비밀번호에 특수문자가 있어도 URL 인코딩을 신경 쓰지 않아도 된다 — 한 줄짜리
# DATA_SOURCE_NAME 을 쓰면 그 인코딩이 조용한 접속 실패의 원인이 된다.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: malitda
  labels:
    app.kubernetes.io/name: postgres-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-exporter
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.19.0
          env:
            - name: DATA_SOURCE_URI
              value: postgres.malitda.svc.cluster.local:5432/?sslmode=disable
            - name: DATA_SOURCE_USER
              valueFrom:
                secretKeyRef: {name: malitda-postgres, key: POSTGRES_USER}
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef: {name: malitda-postgres, key: POSTGRES_PASSWORD}
          ports:
            - name: metrics
              containerPort: 9187
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits:   {memory: 96Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: malitda
  labels:
    app.kubernetes.io/name: postgres-exporter
spec:
  selector:
    app.kubernetes.io/name: postgres-exporter
  ports:
    - name: metrics
      port: 9187
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: postgres-exporter
  namespace: malitda
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-exporter
  endpoints:
    - port: metrics
      interval: 30s
