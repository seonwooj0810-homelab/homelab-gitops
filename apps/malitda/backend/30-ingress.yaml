apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: malitda
  namespace: malitda
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # 채점 WebSocket은 발화가 끝날 때까지 열려 있다. ingress-nginx 기본 읽기 타임아웃
    # 60초로는 천천히 읽는 사용자의 연결이 중간에 끊긴다.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [ malitda.geonganghaejim.site ]
      secretName: malitda-tls
    # 새 호스트는 인증서를 따로 둔다. 발급이 실패해도 기존 인증서 갱신에 번지지 않는다.
    - hosts: [ malitda.junghaebom.com ]
      secretName: malitda-junghaebom-tls
  rules:
    - host: malitda.geonganghaejim.site
      # 두 호스트가 같은 경로 표를 쓴다. 경로는 여기 한 곳만 고친다.
      http: &malitda-paths
        paths:
          # 더 긴 prefix가 먼저 매칭되므로 /api·/ws가 / 보다 우선한다.
          - path: /api
            pathType: Prefix
            backend: { service: { name: backend, port: { number: 8080 } } }
          - path: /ws
            pathType: Prefix
            backend: { service: { name: backend, port: { number: 8080 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: frontend, port: { number: 3000 } } }
    - host: malitda.junghaebom.com
      http: *malitda-paths
