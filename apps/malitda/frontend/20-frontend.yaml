apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: malitda
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      # Dockerfile이 uid 10001(nextjs)로 USER를 지정하지만, k8s 레벨에서도 강제해
      # 이미지가 root로 바뀌어도 파드가 root로 뜨지 못하게 막는다(defense in depth).
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: frontend
          image: malitda/frontend:bootstrap
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 3000
          # 백엔드 주소는 런타임 env가 아니라 이미지 빌드 시점에 박힌다(NEXT_PUBLIC_*).
          # 주소를 바꾸려면 이미지를 다시 빌드해야 한다.
          resources:
            requests: { memory: 128Mi, cpu: 50m }
            limits: { memory: 512Mi, cpu: 500m }
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: malitda
spec:
  selector: { app: frontend }
  ports:
    - port: 3000
      targetPort: 3000
