# /etc/systemd/journald.conf.d/homelab.conf 로 설치한다.
#
# 이유: 로그를 Loki로 보내면서 호스트 journald에도 무한정 쌓을 이유가 없다.
# 2026-09-22 실측 시점에 journald가 2.3GB였고 상한 설정이 아예 없었다.
#
# **Argo CD가 적용할 수 없는 호스트 변경이다.** 설계 7절에 따라 2단계의 수동 적용 단계로 묶는다:
#   sudo install -D -m 0644 operations/journald-homelab.conf \
#     /etc/systemd/journald.conf.d/homelab.conf
#   sudo systemctl restart systemd-journald
#   journalctl --disk-usage   # 즉시 줄지 않을 수 있다. 회전 후 1G 이하로 수렴한다
[Journal]
SystemMaxUse=1G
SystemKeepFree=2G
MaxRetentionSec=14day
