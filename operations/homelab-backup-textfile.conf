# /etc/systemd/system/homelab-backup.service.d/textfile.conf 로 설치한다.
#
# 기존 유닛 파일을 고치지 않고 drop-in으로 얹는다 — 되돌릴 때 이 파일만 지우면 되고,
# homelab-backup.service 본체는 손대지 않아 diff가 섞이지 않는다.
#
# ExecStopPost는 ExecStart의 성공/실패와 무관하게 실행된다. 스크립트가 완료본
# 존재 여부로 판단하므로 실패한 실행 뒤에도 올바른 값을 쓴다.
[Service]
ExecStopPost=/usr/local/sbin/homelab-backup-textfile
