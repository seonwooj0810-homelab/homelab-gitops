name: Update Malitda images
on:
  schedule:
    - cron: '1-56/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: malitda-gitops-images
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - run: python3 operations/update-malitda-images.py
        env:
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
      - name: Commit desired image versions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/malitda/*/kustomization.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore(malitda): sync production image digests [skip ci]"
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
