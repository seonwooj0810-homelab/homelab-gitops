# Loki 7.3.0 (appVersion 3.6.12) — 단일 노드 filesystem 모드
# Ruling R1: 설계가 적은 7.4.0은 존재하지 않는 버전이라 7.3.0으로 내렸다.
#
# **schemaConfig는 반드시 있어야 한다(설계 5절).** 차트의 templates/validate.yaml이
# loki.schemaConfig와 loki.structuredConfig.schema_config가 모두 비어 있고
# useTestSchema가 false면 `fail`로 렌더링을 거부한다. 기본값이 {} 라 빠뜨리면 배포 자체가 안 된다.
#
# 같은 파일이 "filesystem에서 SingleBinary replica > 1"도 거부하므로 replicas는 1을 유지한다.

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  server:
    # **기본 info를 warn으로 내린다.**
    #
    # Loki는 쿼리 하나마다 caller=metrics.go 로 쿼리 문자열과 통계 수십 개를 INFO로 찍는다.
    # 실측(2026-09-23): Loki 컨테이너 하나가 시간당 18,050줄, 클러스터 전체 26,425줄의 68%였다.
    # 그 로그를 Alloy가 다시 Loki로 넣으므로, 관측 스택이 자기 저장소를 자기 로그로 채운다.
    #
    # 게다가 Grafana 로그 패널의 쿼리에 `error|exception|fatal|panic`이 들어 있어
    # Loki가 그 쿼리 문자열을 INFO로 기록하면 **패널이 자기 쿼리를 잡는 되먹임**이 된다.
    # 실제로 패널이 잡은 7,884줄 중 7,760줄(98.4%)이 이것이었다.
    #
    # warn으로 내리면 위 INFO 계열(metrics.go·engine.go·table_manager.go)이 사라진다.
    # 진짜 문제는 warn/error로 나오므로 진단 능력은 유지된다.
    log_level: warn
  commonConfig:
    replication_factor: 1
    # **링을 프로세스 안에 둔다.**
    #
    # 차트 기본값은 memberlist(가십) 링이라, 기동할 때마다 loki-memberlist 헤드리스
    # 서비스를 찾는다. 그런데 그 서비스의 엔드포인트는 자기 Pod 하나뿐이고 Ready 전에는
    # 비어 있어서, 기동 직후 DNS가 NXDOMAIN을 준다:
    #   caller=memberlist_logger.go level=warn msg="Failed to resolve loki-memberlist..."
    #   caller=memberlist_client.go level=error msg="failed to fast-join the memberlist cluster"
    # 몇 초 뒤 스스로 해소되지만 재시작마다 warn/error가 쌓이고 로그 패널에 뜬다.
    #
    # replica가 1이고 스토리지가 filesystem인 배포에는 애초에 가십 링이 필요 없다.
    # inmemory로 두면 이 경로 자체가 사라진다. replica를 늘리려면 되돌려야 하는데,
    # 그건 오브젝트 스토리지가 먼저 필요해서(차트 validate가 막는다) 당장 올 일이 아니다.
    ring:
      kvstore:
        store: inmemory
  storage:
    type: filesystem
  schemaConfig:
    configs:
      # **과거 날짜로 잡는다(Ruling R8).** schema 시작일보다 이른 타임스탬프의 항목이 들어오면
      # Loki가 그 항목만 버리는 게 아니라 `failed to create stream: no schema config found for time`
      # 으로 **push 전체를 500** 처리한다. 같은 배치의 정상 로그까지 통째로 사라진다.
      # 노드에는 121일치 컨테이너 로그가 있으므로 그보다 충분히 이전으로 둔다.
      - from: "2025-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    # 보존은 compactor가 집행한다. 14일(336h) — 로그가 메트릭보다 빨리 찬다(설계 7절).
    retention_period: 336h
    # 단일 노드 홈랩 규모에 맞춰 기본 상한을 낮춘다. 폭주하는 Pod 하나가 볼륨을 채우는 것을 막는다.
    ingestion_rate_mb: 8
    ingestion_burst_size_mb: 16
    volume_enabled: true
  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    delete_request_store: filesystem
  # 단일 노드라 링 상태를 메모리에 둔다.
  ingester:
    chunk_encoding: snappy

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 30Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits:   {memory: 1Gi}
  extraEnv:
    - name: GOMEMLIMIT
      value: "900MiB"

# ── 자기 감시 ────────────────────────────────────────────────────────────────
# Loki가 스크랩되지 않으면 **로그 수집이 멈춰도 아무도 모른다.**
# 이 스택 구축 중 실제로 네 번 그 상태가 됐다(경로 조합 오류, 배치 400 거부,
# stage.drop 전량 폐기, schema 500). 매번 "에러 없이 조용히 0건"이라
# 직접 쿼리를 던져보기 전에는 정상과 구별되지 않았다.
# rules/homelab-rules.yaml 의 LogIngestionStopped 가 이 메트릭을 쓴다.
monitoring:
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
  # 차트가 자체 알림 규칙도 만들 수 있으나 켜지 않는다 — 분산 배포 전제의 규칙이 많아
  # 단일 노드에서는 상시 오탐이 된다(설계 12절의 반복).
  rules:
    enabled: false
  selfMonitoring:
    enabled: false
  lokiCanary:
    enabled: false

# ── 단일 노드에서 켜면 안 되는 것들 ───────────────────────────────────────────
# backend/read/write는 **기본값이 각각 replicas: 3** 이다. SingleBinary를 쓰면서 그대로 두면
# 오브젝트 스토리지가 없다고 validate가 거부하거나, 뜬다 해도 노드를 잡아먹는다.
backend:  {replicas: 0}
read:     {replicas: 0}
write:    {replicas: 0}
ingester: {replicas: 0}
distributor: {replicas: 0}
querier:  {replicas: 0}
queryFrontend:  {replicas: 0}
queryScheduler: {replicas: 0}
indexGateway:   {replicas: 0}
compactor: {replicas: 0}   # 분산 모드의 compactor 타깃. 보존은 위 loki.compactor가 한다
ruler:     {replicas: 0}

# memcached 기반 캐시. 기본이 enabled: true이고 GB 단위를 잡는다. 이 규모에선 순손해다.
chunksCache:  {enabled: false}
resultsCache: {enabled: false}

# nginx 게이트웨이. Alloy가 Loki에 직접 쓰고 Grafana도 직접 읽으므로 필요 없다.
gateway: {enabled: false}

# 카나리와 helm test는 상시 Pod를 늘린다. validate가 "test는 lokiCanary를 요구"하므로 같이 끈다.
lokiCanary: {enabled: false}
test:       {enabled: false}
