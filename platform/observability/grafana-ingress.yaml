# Grafana 공개 노출(설계 9절). platform/60-argocd-ingress.yaml과 같은 패턴을 쓴다.
# Traefik의 CRD provider는 꺼져 있으므로 middlewares.traefik.io는 쓰지 않는다.
#
# Prometheus와 Alertmanager UI는 일부러 Ingress를 만들지 않는다. Grafana만 연다.
# 필요하면 port-forward로 본다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: observability
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: grafana.geonganghaejim.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kube-prometheus-stack-grafana
                port:
                  number: 80
    - host: grafana.junghaebom.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kube-prometheus-stack-grafana
                port:
                  number: 80
  tls:
    - hosts:
        - grafana.geonganghaejim.site
      secretName: grafana-tls
    # 새 호스트는 인증서를 따로 둔다. 발급이 실패해도 기존 인증서 갱신에 번지지 않는다.
    - hosts:
        - grafana.junghaebom.com
      secretName: grafana-junghaebom-tls
