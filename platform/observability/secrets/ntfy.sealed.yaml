# ntfy 발행 URL. 토픽 이름이 URL에 들어 있고 이 저장소는 공개이므로 평문으로 두지 않는다.
# argocd-notifications-cm은 이 키를 $ntfy-url로 참조한다(ConfigMap에 토픽이 남지 않는다).
#
# argocd-notifications-secret은 argo-cd Helm 차트가 이미 만들어 둔(빈) Secret이라
# 통째로 덮어쓰지 않고 이 키만 얹는다:
#   patch   — 다른 키를 지우지 않고 이 키만 추가/갱신한다
#   managed — 컨트롤러가 만들지 않은 기존 Secret도 건드릴 수 있게 한다
# 둘 중 하나라도 없으면 컨트롤러가 기존 Secret을 만나 갱신을 거부한다.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: argocd-notifications-secret
  namespace: argocd
spec:
  encryptedData:
    ntfy-url: 
  template:
    metadata:
      name: argocd-notifications-secret
      namespace: argocd
      annotations:
        sealedsecrets.bitnami.com/patch: "true"
        sealedsecrets.bitnami.com/managed: "true"
    type: Opaque
