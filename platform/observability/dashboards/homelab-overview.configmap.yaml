# Grafana 대시보드 "홈랩 한눈에".
#
# Grafana 사이드카(grafana-sc-dashboard)가 `grafana_dashboard: "1"` 라벨이 붙은 ConfigMap을
# 전 네임스페이스에서 찾아 자동으로 올린다(사이드카 env: LABEL=grafana_dashboard,
# LABEL_VALUE=1, NAMESPACE=ALL). 그래서 이 파일을 커밋하는 것만으로 대시보드가 생긴다.
#
# **UI에서 손으로 만들지 않는 이유**: Grafana PVC는 2Gi짜리 local-path이고 관측 데이터는
# 설계상 소모성이다(설계 7절). UI에서 만든 대시보드는 볼륨이 날아가면 함께 사라진다.
# 여기 두면 Argo CD가 다시 만들어 준다.
#
# 패널의 쿼리는 전부 배치 전에 Prometheus/Loki에 직접 던져 **비어 있지 않은 결과**를
# 확인했다. 예외는 `SERVER_ERROR` 계열 하나로, 그건 아직 5xx가 난 적이 없어서다
# (`outcome` 라벨 자체는 존재한다 — CLIENT_ERROR/SUCCESS 확인).
#
# 고칠 때: UI에서 편집 -> Dashboard settings -> JSON Model 복사 -> 아래 data 블록 교체.
# UI에서 직접 저장해도 되지만 그건 다음 sync 때 이 파일 내용으로 되돌아간다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-homelab-overview
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  homelab-overview.json: |-
    {
      "uid": "homelab-overview",
      "title": "홈랩 한눈에",
      "description": "노트북 홈서버 전체 상태. 위에서 아래로 노드 -> 용량 -> 앱/DB -> 로그 순.",
      "tags": [
        "homelab",
        "overview"
      ],
      "timezone": "Asia/Seoul",
      "editable": true,
      "schemaVersion": 39,
      "version": 1,
      "refresh": "1m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "timepicker": {
        "refresh_intervals": [
          "30s",
          "1m",
          "5m",
          "15m",
          "1h"
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "노드 CPU",
          "description": "전 코어 평균 사용률. 단일 노드라 이 값이 곧 클러스터 전체다.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "100 - (avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)",
              "legendFormat": "",
              "range": false,
              "instant": true,
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 70
                  },
                  {
                    "color": "red",
                    "value": 85
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "메모리",
          "description": "MemAvailable 기준. 버퍼/캐시는 사용으로 치지 않는다.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)",
              "legendFormat": "",
              "range": false,
              "instant": true,
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 75
                  },
                  {
                    "color": "red",
                    "value": 90
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "루트 디스크 여유",
          "description": "local-path PVC가 전부 이 파일시스템 위에 있다. 여기가 차면 PVC도 함께 죽는다.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 0
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "100 * sum(node_filesystem_avail_bytes{mountpoint=\"/\",fstype!~\"tmpfs|overlay\"}) / sum(node_filesystem_size_bytes{mountpoint=\"/\",fstype!~\"tmpfs|overlay\"})",
              "legendFormat": "",
              "range": false,
              "instant": true,
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 15
                  },
                  {
                    "color": "green",
                    "value": 25
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          }
