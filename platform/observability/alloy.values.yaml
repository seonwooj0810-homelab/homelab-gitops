# Grafana Alloy 1.12.1 (appVersion v1.19.2) — 노드의 Pod 로그를 읽어 Loki로 보낸다
#
# 설계 4절의 핵심: **수집 경로가 product 네임스페이스를 통과하지 않는다.**
# Alloy는 노드의 /var/log/pods 파일을 직접 읽으므로 tobehealthy·malitda의
# default-deny NetworkPolicy를 건드릴 필요가 없다.
controller:
  type: daemonset
  # positions 파일을 노드 디스크에 둔다(아래 alloy.storagePath).
  # 기본값 /tmp/alloy는 컨테이너 수명과 함께 사라져서, Alloy가 재시작할 때마다
  #   (1) 121일치 과거 로그를 처음부터 다시 읽어 올리고
  #   (2) Alloy가 죽어 있던 동안 쓰인 로그를 통째로 건너뛴다.
  # (2)는 "어젯밤에 왜 죽었는가"를 못 보게 만드는 것이라 2단계 목표와 정면으로 충돌한다.
  volumes:
    extra:
      - name: alloy-positions
        hostPath:
          path: /var/lib/alloy
          type: DirectoryOrCreate

alloy:
  storagePath: /var/lib/alloy
  mounts:
    # /var/log/pods 를 읽기 위해 필요하다.
    varlog: true
    extra:
      - name: alloy-positions
        mountPath: /var/lib/alloy
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits:   {memory: 512Mi}
  configMap:
    create: true
    content: |-
      // 클러스터의 Pod 목록을 API에서 받아온다.
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // 노드 로컬 Pod만 남긴다. DaemonSet이므로 각 노드가 자기 몫만 읽는다.
      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          regex         = sys.env("HOSTNAME")
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
        // 파일 경로를 만든다. 실제 배치는 이렇다:
        //   /var/log/pods/<ns>_<pod>_<uid>/<container>/<N>.log
        //
        // uid와 container만 이어 붙이고 앞에 `*`를 둔다. 기본 regex가 `(.*)`라
        // $1 = "<uid>/<container>" 가 통째로 들어가서
        //   /var/log/pods/*<uid>/<container>/*.log
        // 가 되고, 앞의 `*`가 "<ns>_<pod>_" 를 먹는다.
        //
        // 여기서 네 라벨을 각각 캡처해 $1(=namespace)만 쓰면
        // /var/log/pods/*<ns>/*.log 가 되어 **아무 파일도 매치하지 않는다.**
        // 에러 없이 조용히 0건이 되므로 로그만 봐서는 드러나지 않는다.
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          action        = "replace"
          replacement   = "/var/log/pods/*$1/*.log"
          target_label  = "__path__"
        }
      }

      local.file_match "pod_logs" {
        path_targets = discovery.relabel.pod_logs.output
        // 기본 10초. tail_from_end와 짝을 이루면 이 지연만큼이 새 Pod의 앞부분 유실로
        // 그대로 이어진다(실측: 10초 기본값에서 첫 3줄 유실). 3초로 줄인다.
        // 더 줄여도 되지만 노드 디스크를 그만큼 자주 훑는다.
        sync_period = "3s"
      }

      loki.source.file "pod_logs" {
        targets    = local.file_match.pod_logs.targets
        forward_to = [loki.process.pod_logs.receiver]

        // 저장된 위치가 없는 파일은 **끝에서부터** 읽는다.
        //
        // 없으면 처음 발견한 파일을 byte 0부터 읽어, 이 노드의 121일치 과거 로그가
        // 전부 올라간다. 그 과거 항목이 push를 통째로 실패시켜 정상 로그까지 잃는다.
        //
        // 위치 파일이 있는 파일에는 적용되지 않으므로, 재시작 후에는 멈춘 지점부터
        // 이어 읽는다(그래서 위의 hostPath 영속화가 짝이 된다).
        // 새로 만들어진 Pod의 파일은 발견까지 수 초라 잃는 것은 많아야 처음 몇 줄이다.
        tail_from_end = true
      }

      // CRI 포맷(k3s containerd)의 타임스탬프/스트림을 분리한다.
      // 이게 없으면 모든 줄 앞에 "2026-09-23T01:02:03.123456789Z stdout F " 가 붙는다.
      loki.process "pod_logs" {
        stage.cri {}

        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.observability.svc.cluster.local:3100/loki/api/v1/push"
        }
      }
