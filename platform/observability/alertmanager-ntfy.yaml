# Alertmanager -> ntfy 릴레이(설계 8.1).
#
# 왜 필요한가: ntfy는 POST 본문을 그대로 알림 문구로 삼는데, Alertmanager의
# webhook_configs 본문은 Alertmanager 고유 JSON으로 고정된다. 직접 붙이면 폰에
# 원시 JSON 덩어리가 뜬다. 알림을 실제로 읽게 만드는 것이 이 스택의 목적이므로
# 릴레이를 하나 둬서 사람이 읽을 수 있는 문장으로 바꾼다.
#
# 서드파티 의존이라 이미지를 digest로 고정한다(12절 리스크). 실패 시 폴백은
# 설계 8.1의 "릴레이 없이 헤더만" 방식이다.
#
# 설정 파일에는 ntfy 토픽이 들어가고 이 저장소는 공개이므로, ConfigMap이 아니라
# SealedSecret(secrets/alertmanager-ntfy-config.sealed.yaml)으로 넣고 여기서 마운트만 한다.
# 토픽을 뺀 설정 원형은 alertmanager-ntfy.config.example.yaml 에 있다.
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-ntfy
  namespace: observability
  labels:
    app.kubernetes.io/name: alertmanager-ntfy
spec:
  selector:
    app.kubernetes.io/name: alertmanager-ntfy
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager-ntfy
  namespace: observability
  labels:
    app.kubernetes.io/name: alertmanager-ntfy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager-ntfy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager-ntfy
      annotations:
        # 설정이 바뀌면 Pod를 다시 띄워야 한다. Secret 마운트는 갱신이 즉시 반영되지 않고
        # 이 앱은 설정을 기동 시 한 번만 읽는다.
        checksum/config-hint: "sealed-secret: alertmanager-ntfy-config"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alertmanager-ntfy
          image: ghcr.io/alexbakker/alertmanager-ntfy:1.2.1@sha256:2a862f23c8fb67f777824979487c06a417b2f9bbbc2eb45a974a1fb45b9bbff3
          # 플래그는 `--configs`(복수)다. `-config`로 주면 기동 즉시
          # `unknown shorthand flag: 'c' in -config`로 죽는다(Ruling R7).
          args: ["--configs", "/etc/alertmanager-ntfy/config.yml"]
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager-ntfy
              readOnly: true
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits:   {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          secret:
            secretName: alertmanager-ntfy-config
