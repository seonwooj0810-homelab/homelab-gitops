# Argo CD UI 노출. bootstrap/platform-core.yaml Application이 관리한다.
#
# 이전 주석은 "자기 자신을 배포할 수는 없다"를 근거로 수동 apply라고 적었는데,
# 그 근거는 이 파일에 해당하지 않는다. Argo CD의 자기 관리에서 조심할 대상은
# argocd-server·application-controller 같은 핵심 워크로드다(sync 도중 자기를
# 재시작시켜 reconcile 루프가 끊길 수 있다). argocd-server를 가리키는 Ingress
# 오브젝트는 그냥 평범한 리소스다.
#
# backend-protocol이 HTTP인 이유: argocd-server의 80 포트는 평문이고, TLS는 인그레스가
# 종단한다. HTTPS로 바꾸려면 argocd-server를 --insecure 없이 돌리고 포트도 443으로 바꿔야 한다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd
  namespace: argocd
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: argocd.geonganghaejim.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
    - host: argocd.junghaebom.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
  tls:
    - hosts:
        - argocd.geonganghaejim.site
      secretName: argocd-tls
    # 새 호스트는 인증서를 따로 둔다. 발급이 실패해도 기존 인증서 갱신에 번지지 않는다.
    - hosts:
        - argocd.junghaebom.com
      secretName: argocd-junghaebom-tls
