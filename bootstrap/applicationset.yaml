apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenants
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  # 생성된 Application에는 resources-finalizer가 붙어 있어서, 이 AppSet이 어떤 이유로든
  # Application을 지우면 geonganghaegym의 라이브 리소스까지 연쇄 삭제된다(제너레이터가 일시적으로
  # 0개 디렉터리를 반환하는 경우 등). 그때 앱만 사라지고 워크로드는 남도록 한다.
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - git:
        repoURL: https://github.com/seonwooj0810-homelab/homelab-gitops.git
        revision: main
        directories:
          - path: apps/*/overlays/*
  template:
    metadata:
      # e.g. geonganghaegym-prod, geonganghaegym-dev
      name: '{{ index .path.segments 1 }}-{{ index .path.segments 3 }}'
      labels:
        project: '{{ index .path.segments 1 }}'
        env: '{{ index .path.segments 3 }}'
    spec:
      project: default
      source:
        repoURL: https://github.com/seonwooj0810-homelab/homelab-gitops.git
        targetRevision: main
        path: '{{ .path.path }}'
      destination:
        server: https://kubernetes.default.svc
        # prod uses the bare project name (preserves existing namespace);
        # other envs append the env suffix (e.g. geonganghaegym-dev).
        namespace: '{{ if eq (index .path.segments 3) "prod" }}{{ index .path.segments 1 }}{{ else }}{{ index .path.segments 1 }}-{{ index .path.segments 3 }}{{ end }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m
