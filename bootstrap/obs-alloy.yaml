# 로그 수집·저장(설계 2단계). multi-source — 차트는 helm repo, values는 이 저장소.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: obs-alloy
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.12.1
      helm:
        releaseName: alloy
        valueFiles:
          - $values/platform/observability/alloy.values.yaml
    - repoURL: https://github.com/seonwooj0810-homelab/homelab-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
