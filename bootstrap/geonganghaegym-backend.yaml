apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: geonganghaegym-backend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/seonwooj0810-homelab/homelab-gitops.git
    targetRevision: main
    path: apps/geonganghaegym/backend
  destination:
    server: https://kubernetes.default.svc
    namespace: geonganghaegym
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
