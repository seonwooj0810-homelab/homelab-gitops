# platform/ 의 플랫폼 리소스를 Argo CD 관리로 승격한다(설계 5절).
# 관측 스택이 첫 Argo 관리 platform 컴포넌트가 되면서 README가 선언한 구조와 일치시킨다.
#
# adopt 게이트(설계 5.2)를 통과한 뒤 automated를 켰다. 2026-09-23 10:34 KST 실측 기록:
# automated 없이 먼저 만들고 `argocd app diff`를 돌린 결과, 네 리소스 모두 차이가
# Argo가 adopt하며 붙이는 `argocd.argoproj.io/tracking-id` 애노테이션 한 줄뿐이었다.
# 내용 차이가 0이라 selfHeal이 라이브를 덮어쓸 여지가 없음을 확인하고 켰다.
# 동기화 후 Ingress host/tls, ClusterIssuer 2개 READY, argocdUrl이 그대로임을 실물로 확인했다.
#
# traefik-values.yaml은 포함하지 않는다 — Helm values 파일이지 k8s 매니페스트가 아니고,
# Traefik 마이그레이션이 끝날 때까지 수동 유지 대상이다(operations/README.md).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-core
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/seonwooj0810-homelab/homelab-gitops.git
    targetRevision: main
    path: platform
    directory:
      recurse: false
      include: '{50-clusterissuers.yaml,60-argocd-ingress.yaml,70-argocd-notifications-cm.yaml,71-argocd-cmd-params-cm.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
